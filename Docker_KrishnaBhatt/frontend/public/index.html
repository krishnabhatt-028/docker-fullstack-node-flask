<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Full-Stack Form</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#172033}
.card{width:min(92%,520px);background:#fff;padding:32px;border-radius:16px;box-shadow:0 12px 35px rgba(0,0,0,.1)}
h1{margin-top:0}p{color:#596579}label{display:block;margin:16px 0 7px;font-weight:600}
input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
textarea{min-height:120px;resize:vertical}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
#result{margin-top:18px;padding:12px;border-radius:8px;display:none}
</style>
</head>
<body><main class="card">
<h1>Full-Stack Docker Form</h1><p>Node.js/Express frontend → Flask backend</p>
<form id="contactForm">
<label>Name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Message</label><textarea name="message" required></textarea>
<button type="submit">Submit</button></form><div id="result"></div>
</main>
<script>
const form=document.getElementById("contactForm"), result=document.getElementById("result");
form.addEventListener("submit",async(e)=>{
 e.preventDefault(); result.style.display="block"; result.textContent="Submitting...";
 const payload=Object.fromEntries(new FormData(form).entries());
 try{
  const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const d=await r.json(); result.textContent=d.message||"Request completed."; result.style.background=r.ok?"#dcfce7":"#fee2e2";
 }catch(err){result.textContent="Request failed. Please try again.";result.style.background="#fee2e2";}
});
</script></body></html>
